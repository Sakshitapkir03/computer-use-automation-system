[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rpa-agent"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["artifact*", "agent*", "replay*", "guardrails*", "escalation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
