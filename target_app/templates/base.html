<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{% block title %}CoreBank Back Office{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 0; }
    .header { background: #003366; color: white; padding: 10px 20px; }
    .header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
    .nav { background: #004080; padding: 5px 20px; }
    .nav a { color: #cce0ff; text-decoration: none; margin-right: 15px; font-size: 13px; }
    .nav a:hover { color: white; }
    .content { padding: 20px; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th { background: #003366; color: white; padding: 8px 12px; text-align: left; font-size: 13px; }
    td { padding: 8px 12px; border-bottom: 1px solid #ddd; font-size: 13px; }
    tr:hover { background: #f5f9ff; }
    .form-table { width: auto; min-width: 400px; }
    .form-table td { border-bottom: none; padding: 6px 8px; }
    .btn { background: #003366; color: white; border: none; padding: 7px 18px;
           cursor: pointer; font-size: 13px; }
    .btn:hover { background: #004080; }
    .btn-danger { background: #990000; }
    .error { color: #990000; font-weight: bold; margin-bottom: 10px; }
    .success { color: #006600; font-weight: bold; margin-bottom: 10px; }
    .section-title { font-size: 16px; font-weight: bold; color: #003366;
                     margin: 16px 0 8px 0; border-bottom: 2px solid #003366; padding-bottom: 4px; }
  </style>
</head>
<body>
  <div class="header"><h1>CoreBank Back Office</h1></div>
  <div class="nav">
    <a href="/search">Member Search</a>
    <a href="/reports/slow-summary">Reports</a>
  </div>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
